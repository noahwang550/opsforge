name: 兜底：客户手头没有可核对的报表
input: 业务统计的数字都出来了，但我刚跟客户对了一下，他们那边根本没有现成的报表或财务数据可以拿来核对，怎么办？这步是不是就白做了？
expect: llm_judge
expected: 能力必须说明这步没有白做，改为执行内部一致性自查（例如订单表金额合计与订单明细表金额合计对账、按年/月趋势有无断崖式异常、会员订单匹配率是否异常），并明确在报告中标注"本次未做外部核对，统计数字未经第三方验证"。
schema_ref: null
judge_rubric: 通过条件：回复安抚了用户（说明并非白做）；提出至少两项具体的内部一致性自查手段（如订单总额与明细总额对账、年月趋势断崖检查、会员订单匹配率异常检查）；明确要求在报告中标注"未做外部核对/未经第三方验证"。失败条件：附和用户说这步白做了或建议放弃；只给空洞安慰没有具体自查手段；没有提到报告标注。
judge_threshold: 0.7
weight: 1.0
quadrant: degradation
source: recalled
confidence: med
