name: opsforge-release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Run release --all
        run: node tools/release.mjs --all
      - name: Commit registry
        run: |
          git config user.name "opsforge-bot"
          git config user.email "bot@opsforge.dev"
          git add registry.yaml registry-brands.yaml || true
          git diff --staged --quiet || git commit -m "chore: update registry.yaml [skip ci]"
          git push
