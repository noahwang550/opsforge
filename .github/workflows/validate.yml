name: opsforge-validate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Run validate --all (§A conformance + regression_cases)
        run: node tools/validate.mjs --all
      - name: Run security-scan --all (§B non-exceptionable families)
        run: node tools/security-scan.mjs --all
      - name: Run eval --all (§21.4 5-axis, 3rd CI artifact; verdict pending in static-only)
        run: node tools/eval.mjs --all
      - name: Run release --all (§B.4 3-report gate)
        run: node tools/release.mjs --all
      - name: Inventory README drift gate (capability inventory SSOT)
        run: node tools/inventory.mjs --check-readme

  # Phase 2.1: per-platform install doctor matrix (claude-code/cursor/codex/cline).
  # Tier-1 platforms must report healthy; Tier-2 platforms only need the adapter
  # to load (detect() may be false when the platform's config dir is absent in CI).
  doctor-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [claude-code, cursor, codex, cline, dify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Adapter loads for ${{ matrix.platform }}
        run: node -e "import('./adapters/${{ matrix.platform }}/adapter.mjs').then(m => { if(!m.adapter) process.exit(1); console.log('adapter ok: ${{ matrix.platform }} tier=' + m.adapter.tier()); })"
